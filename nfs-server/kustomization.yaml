apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automount-nfs-poc

configMapGenerator:
- name: nfs-server-init
  files:
  - init.sh

images:
  - name: quay.io/noseka1/openshift-toolbox
    newName: quay.io/noseka1/toolbox-container
    newTag: basic

resources:
- nfs-server-deploy.yaml
- nfs-server-exports-pvc.yaml
- nfs-server-sa.yaml
- nfs-server-scc-rolebinding.yaml
- nfs-server-scc-role.yaml
- nfs-server-svc.yaml
